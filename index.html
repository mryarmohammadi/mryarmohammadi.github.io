<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="google-site-verification" content="F0ed6WvIYNC0Qrj-R0rtPpGuq_HSk9ca4MXCSjg3oKA">

<title>محمدرضا یارمحمدی</title>

<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&display=swap" rel="stylesheet">

<style>
:root {
    --bg: #0a0a0a;
    --text: #ffffff;
    --gold: #d4af37;
    --card-bg: #111111;
}

body.light {
    --bg: #f9f9f9;
    --text: #111111;
    --gold: #b8860b;
    --card-bg: #ffffff;
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: 'Amiri', serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    justify-content: center;
    min-height: 100vh;
    padding: 20px 15px;
    transition: background 0.3s, color 0.3s;
}

.container {
    width: 100%;
    max-width: 450px;
    display: flex;
    flex-direction: column;
}

/* نوار بالایی */
.top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 30px;
}

.theme-toggle {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 40px;
    height: 40px;
    border: 1px solid var(--gold);
    border-radius: 10px;
    color: var(--gold);
    cursor: pointer;
    transition: 0.3s;
    background: transparent;
}

.theme-toggle:hover {
    background: rgba(212, 175, 55, 0.1);
}

.theme-toggle svg {
    width: 22px;
    height: 22px;
    fill: var(--gold);
}

.lang-switch {
    display: flex;
    gap: 15px;
    font-family: Arial, sans-serif;
    font-size: 0.85rem;
    font-weight: bold;
    color: var(--text);
}

.lang-switch span {
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 5px;
    opacity: 0.7;
    transition: 0.3s;
}

.lang-switch span:hover, .lang-switch span.active {
    opacity: 1;
}

.lang-divider {
    color: var(--gold);
    opacity: 0.5;
}

/* لوگو به صورت عکس */
.header-section {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 15px;
    margin-bottom: 25px;
}

.logo-img {
    width: 70px;
    height: 70px;
    border-radius: 50%;
    border: 2px solid var(--gold);
    object-fit: cover;
    background-color: var(--gold);
}

h1 {
    font-size: 2.2rem;
    color: var(--gold);
    font-weight: 700;
}

/* عکس پروفایل */
.profile-img {
    width: 240px;
    height: 240px;
    border-radius: 50%;
    object-fit: cover;
    border: 2px solid var(--gold);
    margin: 0 auto 35px auto;
    display: block;
    filter: grayscale(100%);
}

/* بخش لینک‌ها (کارت‌ها) */
.links-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 15px;
    width: 100%;
}

.card {
    position: relative;
    background: var(--card-bg);
    border-radius: 12px;
    padding: 20px 5px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-decoration: none;
    color: var(--text);
    font-family: Arial, sans-serif;
    font-size: 0.9rem;
    transition: transform 0.25s;
    z-index: 1;
}

.card:hover {
    transform: translateY(-3px);
}

.card::before {
    content: "";
    position: absolute;
    inset: -1.5px;
    border-radius: 13.5px;
    z-index: -1;
}

.card-email::before { background: linear-gradient(135deg, #ff416c, #ff4b2b); }
.card-insta::before { background: linear-gradient(135deg, #f09433, #dc2743, #bc1888); }
.card-tele::before  { background: linear-gradient(135deg, #00c6ff, #0072ff); }

/* آیکون‌های SVG */
.card .icon-svg {
    width: 38px;
    height: 38px;
    margin-bottom: 10px;
    display: block;
}

.card-email .icon-svg { fill: #ff416c; }
.card-insta .icon-svg { fill: #dc2743; }
.card-tele .icon-svg  { fill: #00c6ff; }

/* فوتر */
.footer {
    margin-top: auto;
    padding-top: 40px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 15px;
}

.footer-line {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 70%;
    gap: 15px;
}

.footer-line::before, .footer-line::after {
    content: "";
    flex: 1;
    height: 1px;
    background: var(--gold);
    opacity: 0.3;
}

.footer-dot {
    width: 4px;
    height: 4px;
    background: var(--gold);
    border-radius: 50%;
}

.footer p {
    font-family: Arial, sans-serif;
    color: var(--gold);
    font-size: 0.75rem;
    opacity: 0.8;
}

.fade {
    opacity: 0;
    animation: fadeIn 0.8s forwards;
}

@keyframes fadeIn {
    to { opacity: 1; }
}
</style>

<script>
function toggleMode() {
    document.body.classList.toggle('light');
    const moonIcon = document.getElementById('theme-icon');
    if (document.body.classList.contains('light')) {
        localStorage.setItem('theme', 'light');
        // تغییر آیکون به خورشید
        moonIcon.innerHTML = `
            <circle cx="12" cy="12" r="5"/>
            <line x1="12" y1="1" x2="12" y2="3"/>
            <line x1="12" y1="21" x2="12" y2="23"/>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
            <line x1="1" y1="12" x2="3" y2="12"/>
            <line x1="21" y1="12" x2="23" y2="12"/>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
        `;
    } else {
        localStorage.setItem('theme', 'dark');
        moonIcon.innerHTML = `
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        `;
    }
}

window.onload = function() {
    const savedTheme = localStorage.getItem('theme');
    const moonIcon = document.getElementById('theme-icon');
    if (savedTheme === 'light') {
        document.body.classList.add('light');
        moonIcon.innerHTML = `
            <circle cx="12" cy="12" r="5"/>
            <line x1="12" y1="1" x2="12" y2="3"/>
            <line x1="12" y1="21" x2="12" y2="23"/>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
            <line x1="1" y1="12" x2="3" y2="12"/>
            <line x1="21" y1="12" x2="23" y2="12"/>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
        `;
    }
};

function showFA() {
    document.querySelector('.fa-content').style.display = 'block';
    document.querySelector('.en-content').style.display = 'none';
    document.getElementById('btn-fa').classList.add('active');
    document.getElementById('btn-en').classList.remove('active');
}

function showEN() {
    document.querySelector('.fa-content').style.display = 'none';
    document.querySelector('.en-content').style.display = 'block';
    document.getElementById('btn-en').classList.add('active');
    document.getElementById('btn-fa').classList.remove('active');
}
</script>

</head>
<body>

<div class="container">

    <div class="top-bar fade">
        <div class="theme-toggle" onclick="toggleMode()">
            <svg viewBox="0 0 24 24" id="theme-icon">
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
            </svg>
        </div>

        <div class="lang-switch">
            <span id="btn-fa" class="active" onclick="showFA()">🇮🇷 FA</span>
            <span class="lang-divider">|</span>
            <span id="btn-en" onclick="showEN()">🇬🇧 EN</span>
        </div>
    </div>

    <div class="header-section fade">
        <img src="logo.png" alt="لوگو" class="logo-img">
        <h1 class="fa-content">محمدرضا یارمحمدی</h1>
        <h1 class="en-content" style="display: none; font-family: Arial, sans-serif; font-size: 1.8rem;">Mohammadreza Yarmohammadi</h1>
    </div>

    <img src="profile.jpg" class="profile-img fade" alt="محمدرضا یارمحمدی">

    <div class="links-grid fade">
        <!-- ایمیل -->
        <a href="mailto:mfyhmfyhmfyh@gmail.com" class="card card-email">
            <svg class="icon-svg" viewBox="0 0 24 24">
                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
                <polyline points="22,6 12,13 2,6"/>
            </svg>
            <span>Email</span>
        </a>

        <!-- اینستاگرام -->
        <a href="https://instagram.com/mfyh_1030" target="_blank" rel="noopener" class="card card-insta">
            <svg class="icon-svg" viewBox="0 0 24 24">
                <rect x="2" y="2" width="20" height="20" rx="5" ry="5"/>
                <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/>
                <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"/>
            </svg>
            <span>Instagram</span>
        </a>

        <!-- تلگرام -->
        <a href="https://t.me/mfyh_1030" target="_blank" rel="noopener" class="card card-tele">
            <svg class="icon-svg" viewBox="0 0 24 24">
                <path d="M21.5 4.5L2.5 10.5L9.5 13.5L13.5 20.5L21.5 4.5Z"/>
                <path d="M9.5 13.5L12.5 17.5L15.5 10.5"/>
            </svg>
            <span>Telegram</span>
        </a>
    </div>

    <div class="footer fade">
        <div class="footer-line">
            <div class="footer-dot"></div>
        </div>
        <p>© 2025 Mohammadreza Yarmohammadi</p>
    </div>

</div>

</body>
</html>
